submit_delay_ms = 150
scrollback = 20000
mouse = true

[summary]
# Compare each round's answers with `command` (off: a script's merge step
# does that better).
compare = false
command = "claude"
args = ["--print"]
auto = true
quiet_secs = 5
# Variables that name the file a prompt asks each harness to write.
output_vars = ["OUTPUT_FILE", "REVIEW_COMBINED"]

[[harness]]
name = "claude"
command = "claude"
args = ["--model", "claude-opus-5-5"]
env_remove = ["CLAUDECODE", "CLAUDE_CODE_ENTRYPOINT", "CLAUDE_CODE_CHILD_SESSION"]

[[harness]]
name = "codex"
command = "codex"
args = ["-c", "model_reasoning_effort=\"high\""]
env_remove = ["CLAUDECODE", "CLAUDE_CODE_ENTRYPOINT", "CLAUDE_CODE_CHILD_SESSION"]

[[harness]]
name = "agy"
command = "agy"
args = ["--model", "gemini-4-argon", "--effort", "high", "--mode", "auto"]
env_remove = ["CLAUDECODE", "CLAUDE_CODE_ENTRYPOINT", "CLAUDE_CODE_CHILD_SESSION"]

[[harness]]
name = "cursor"
command = "cursor-agent"
env_remove = ["CLAUDECODE", "CLAUDE_CODE_ENTRYPOINT", "CLAUDE_CODE_CHILD_SESSION"]
